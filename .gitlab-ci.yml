# SETUP

variables:
  CURRENT_CI_IMAGE: "9"
  CI_IMAGE_DOCKER: registry.ddbuild.io/ci/dd-sdk-kotlin-multiplatform:$CURRENT_CI_IMAGE
  SLACK_NOTIFIER_IMAGE: registry.ddbuild.io/slack-notifier:latest
  GIT_DEPTH: 6

  KUBERNETES_MEMORY_REQUEST: "8Gi"
  KUBERNETES_MEMORY_LIMIT: "13Gi"

  DD_SERVICE: "dd-sdk-kotlin-multiplatform"
  DD_ENV_TESTS: "ci"
  DD_CIVISIBILITY_ENABLED: "true"
  DD_INSIDE_CI: "true"
  DD_COMMON_AGENT_CONFIG: "dd.env=ci,dd.trace.enabled=false,dd.jmx.fetch.enabled=false"
  DD_JAVA_AGENT_FILE: "dd-java-agent-1.50.0.jar"

  # Xcode used by all macOS jobs. Datadog iOS SDK >= 3.19.0 requires Swift tools 6.2 (Xcode 26+).
  XCODE_VERSION: "26.0.0"

stages:
  - ci-image
  - info
  - analysis
  - test
  - publish
  - notify

.snippets:
  set-publishing-credentials:
    - export GPG_PRIVATE_KEY=$(aws ssm get-parameter --region us-east-1 --name ci.dd-sdk-kotlin-multiplatform.signing.gpg_private_key --with-decryption --query "Parameter.Value" --out text)
    - export GPG_PASSWORD=$(aws ssm get-parameter --region us-east-1 --name ci.dd-sdk-kotlin-multiplatform.signing.gpg_passphrase --with-decryption --query "Parameter.Value" --out text)
    - export CENTRAL_PUBLISHER_USERNAME=$(aws ssm get-parameter --region us-east-1 --name ci.dd-sdk-kotlin-multiplatform.publishing.central_username --with-decryption --query "Parameter.Value" --out text)
    - export CENTRAL_PUBLISHER_PASSWORD=$(aws ssm get-parameter --region us-east-1 --name ci.dd-sdk-kotlin-multiplatform.publishing.central_password --with-decryption --query "Parameter.Value" --out text)

# Gradle sizes its worker pool by the visible CPU count, so without a CPU limit it sees all node vCPUs
# (up to 96 on shared runners) and can get the job OOMKilled. Use for Gradle jobs on Kubernetes runners.
.cpu-memory-intensive-job:
  variables:
    KUBERNETES_MEMORY_REQUEST: 8Gi
    KUBERNETES_MEMORY_LIMIT: 16Gi
    KUBERNETES_CPU_REQUEST: 16
    KUBERNETES_CPU_LIMIT: 16

# Common setup for jobs running on macOS runners: selects the Xcode version defined by XCODE_VERSION.
.macos-job:
  tags: [ "macos:sequoia-arm64", "specific:true" ]
  variables:
    DEVELOPER_DIR: "/Applications/Xcode-$XCODE_VERSION.app/Contents/Developer"
  before_script:
    - |
      if [ ! -d "$DEVELOPER_DIR" ]; then
        echo "Xcode $XCODE_VERSION not found at $DEVELOPER_DIR. Available Xcode versions:"
        ls /Applications/ | grep Xcode
        exit 1
      fi
    - xcodebuild -version

# Installs the iOS/tvOS simulator runtimes for the selected Xcode if they are missing.
.snippets-simulator-runtime:
  ios:
    - xcrun simctl list runtimes | grep -q "iOS 26" || xcodebuild -downloadPlatform iOS -quiet
  tvos:
    - xcrun simctl list runtimes | grep -q "tvOS 26" || xcodebuild -downloadPlatform tvOS -quiet

# Security

# TODO RUM-5306 Signing keys were generated using the image
#  486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/agent-key-management-tools/gpg:1.
# But this image is not compatible with k8s runner, so we need to regenerate keys using compatible
# approach by the time existing keys expire (Aug 2025).

# CI IMAGE

ci-image:
  stage: ci-image
  when: manual
  except: [ tags, schedules ]
  tags: [ "arch:amd64" ]
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:24.0.4-jammy
  script:
    - METADATA_FILE=$(mktemp)
    - docker buildx build --tag $CI_IMAGE_DOCKER --label target=build -f Dockerfile.gitlab --push --metadata-file ${METADATA_FILE} .
    - ddsign sign $CI_IMAGE_DOCKER --docker-metadata-file ${METADATA_FILE}

env-info:
  stage: info
  when: manual
  extends: .macos-job
  allow_failure: true # do not block GH PRs
  script:
    - system_profiler SPSoftwareDataType # system info
    - xcodebuild -version
    - xcode-select -p # default Xcode
    - ls /Applications/ | grep Xcode # other Xcodes
    - xcodebuild -project sample/appleApp/appleApp.xcodeproj -scheme "Sample iOS" -showdestinations -quiet # installed iOS destinations
    - xcodebuild -project sample/appleApp/appleApp.xcodeproj -scheme "Sample tvOS" -showdestinations -quiet # installed tvOS destinations
    - xcbeautify --version
    - swiftlint --version
    - carthage version
    - gh --version
    - brew -v
    - bundler --version
    - python3 -V
    - java --version

# Analysis

static-analysis-ios:
  stage: analysis
  extends: .macos-job
  timeout: 1h
  script:
#    - ./tools/lint/run-linter.sh
    - ./tools/license/check-license.sh

# Android compiler metadata is checked by the analysis:generated-files-check job (checkGeneratedFiles), which runs on Linux,
# where Apple targets are not available, so KLIB compiler metadata needs a dedicated check on macOS.
analysis:apple-compiler-metadata:
  stage: analysis
  extends: .macos-job
  timeout: 1h
  script:
    - ./gradlew checkKlibCompilerMetadataChangesAll --stacktrace --no-daemon

analysis:generated-files-check:
  extends: .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 30m
  script:
    - ./gradlew checkGeneratedFiles --stacktrace --no-daemon

analysis:detekt:
  extends: .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 30m
  script:
    - ./gradlew detektAll --continue --stacktrace --no-daemon

analysis:android-lint:
  extends: .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 30m
  script:
    - ./gradlew lintRelease --stacktrace --no-daemon

analysis:ktlint:
  extends: .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 30m
  script:
    - ./gradlew ktlintCheckAll --stacktrace --no-daemon

analysis:licenses:
  extends: .cpu-memory-intensive-job
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  stage: analysis
  timeout: 30m
  script:
    - ./gradlew checkDependencyLicenses --stacktrace --no-daemon

# Test

jvm-unit-test:
  extends: .cpu-memory-intensive-job
  stage: test
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  timeout: 1h
  script:
    - rm -rf ~/.gradle/daemon/
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - export DD_AGENT_PATH="$(pwd)/$DD_JAVA_AGENT_FILE"
    - ./gradlew jvmUnitTestAll --no-daemon -Dorg.gradle.jvmargs=-javaagent:$DD_AGENT_PATH=$DD_COMMON_AGENT_CONFIG
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/testAndroidHostTest/*.xml"

ios-unit-test:
  stage: test
  extends: .macos-job
  timeout: 1h
  script:
    - export DD_AGENT_PATH="$(pwd)/$DD_JAVA_AGENT_FILE"
    - !reference [.snippets-simulator-runtime, ios]
    - ./gradlew iosUnitTestAll --no-daemon -Dorg.gradle.jvmargs=-javaagent:$DD_AGENT_PATH=$DD_COMMON_AGENT_CONFIG
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/iosSimulatorArm64Test/*.xml"

tvos-unit-test:
  stage: test
  extends: .macos-job
  timeout: 1h
  script:
    - export DD_AGENT_PATH="$(pwd)/$DD_JAVA_AGENT_FILE"
    - !reference [.snippets-simulator-runtime, tvos]
    - ./gradlew tvosUnitTestAll --no-daemon -Dorg.gradle.jvmargs=-javaagent:$DD_AGENT_PATH=$DD_COMMON_AGENT_CONFIG
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/tvosSimulatorArm64Test/*.xml"

sample-app-build-ios:
  stage: test
  extends: .macos-job
  timeout: 1h
  variables:
    BUILD_DESTINATION: "generic/platform=iOS Simulator"
  script:
    # by some reason if we build Datadog frameworks from inside xcodebuild invocation, xcodebuild will crash (only on CI, not in local)
    - ./gradlew :buildDatadogFrameworks
    - xcodebuild -project sample/appleApp/appleApp.xcodeproj -destination "$BUILD_DESTINATION" -scheme "Sample iOS" build | xcbeautify --preserve-unbeautified

sample-app-build-tvos:
  stage: test
  extends: .macos-job
  timeout: 1h
  variables:
    BUILD_DESTINATION: "generic/platform=tvOS Simulator"
  script:
    # by some reason if we build Datadog frameworks from inside xcodebuild invocation, xcodebuild will crash (only on CI, not in local)
    - ./gradlew :buildDatadogFrameworks
    - xcodebuild -project sample/appleApp/appleApp.xcodeproj -destination "$BUILD_DESTINATION" -scheme "Sample tvOS" build | xcbeautify --preserve-unbeautified

sample-app-build-android:
  extends: .cpu-memory-intensive-job
  stage: test
  tags: [ "arch:amd64" ]
  image: $CI_IMAGE_DOCKER
  timeout: 1h
  script:
    - rm -rf ~/.gradle/daemon/
    - export DD_AGENT_HOST="$BUILDENV_HOST_IP"
    - export DD_AGENT_PATH="$(pwd)/$DD_JAVA_AGENT_FILE"
    - ./gradlew :sample:androidApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs=-javaagent:$DD_AGENT_PATH=$DD_COMMON_AGENT_CONFIG

# PUBLISH ARTIFACTS ON MAVEN

publish:release-core:
  extends: .macos-job
